<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Картка — практична CSS</title>
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <!--
    Варіант контенту визначається викладачем.
    Структура (теги, класи) однакова для всіх варіантів —
    змінюється тільки контент усередині.

    Варіант A — Картка ТОВАРУ

  -->

    <article class="card">
      <img
        class="card-image"
        src="images\Bugatti Chiron.jpg"
        alt="Зображення Bugatti Chiron"
      />

      <h3 class="card-title">Bugatti Chiron</h3>

      <p class="card-meta">Автомобіль: S - клас</p>

      <p class="card-description">
        Опис: Автомобіль люкс класу. Висока якість.
      </p>

      <p class="card-price">Ціна: 88 000 000 грн</p>

      <button class="card-action" type="button">Дізнатися більше</button>
    </article>
  </body>
</html>
