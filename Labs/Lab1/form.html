<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <header>
      <h1>Реєстрація</h1>
    </header>

    <form action="/registration" method="post">
      <!-- name-->
      <fieldset>
        <legend>Введіть ваше прізвище та імя</legend>

        <br /><label for="lastname">Введіть прізвище</label>
        <input type="text" id="lastname" name="lastname" required />

        <br /><label for="name">Введіть імя</label>
        <input type="text" id="name" name="name" required />
      </fieldset>

      <!-- email-->
      <fieldset>
        <legend>Введіть реєстраційні дані</legend>
        <br /><label for="email">Введіть електронну пошту</label>
        <input type="email" id="email" name="email" required />

        <br /><label for="password">Введіть пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="10"
          required
        />

        <br /><label for="submit_password">Підтвердження паролю</label>
        <input
          type="password"
          id="submit_password"
          name="submit_password"
          minlength="10"
          required
        />
      </fieldset>

      <fieldset>
        <legend>Введіть інші дані</legend>
        <br /><label for="birthday">Дата народження</label>
        <input type="date" id="birthday" name="birthday" required />

        <br />
        <label
          >Видеріть спеціальність:
          <select name="speciality">
            <option value="Software">ІПЗ</option>
            <option value="Computer siense">КН</option>
          </select>
        </label>
      </fieldset>

      <br /><label for="checkbox">Згода з умовами користувача</label>
      <input type="checkbox" id="checkbox" name="checkbox" required />

      <br /><button type="submit">Реєстрація</button>
    </form>
  </body>
</html>
